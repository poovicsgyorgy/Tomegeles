<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2a2f3a;--tx:#eef0f4;--mut:#9097a6;--acc:#ff7a1a;--acc2:#ffb347;--ok:#3ecf8e;--bad:#ff5c5c;--blue:#5aa9ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:rgba(20,22,28,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}

nav button.on{color:var(--acc)}nav button.on b{filter:none;opacity:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:0 0 10px;font-weight:600}
.hero{background:linear-gradient(135deg,#2a1a0c,#181b22 60%);border-color:#3a2a1a}
.hero .big{font-size:22px;font-weight:700;margin:2px 0 4px}
.mut{color:var(--mut)}.sm{font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}.acc{color:var(--acc)}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.sp{justify-content:space-between}.sp>*{flex:0 0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border-radius:12px;padding:10px}.stat .v{font-size:20px;font-weight:700}.stat .l{font-size:12px;color:var(--mut)}

label{font-size:12px;color:var(--mut);display:block;margin:8px 0 4px}

.x{background:none;border:0;color:var(--mut);font-size:18px;padding:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:20px;padding:7px 11px;font-size:13px}
.chip.on{background:var(--acc);color:#1a0d00;border-color:var(--acc);font-weight:600}
.ex{background:var(--card2);border-radius:12px;padding:10px;margin-bottom:10px}
.ex .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.ex .t b{font-size:15px}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 34px;gap:6px;align-items:center;margin-top:6px}

.tip{border-left:3px solid var(--acc);padding:2px 0 2px 10px}

.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.thumbs div{position:relative}.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--card2);display:block}
.thumbs span{position:absolute;left:4px;bottom:3px;font-size:10px;background:rgba(0,0,0,.6);border-radius:4px;padding:0 4px}

.meal ul{margin:6px 0;padding-left:18px;font-size:14px;color:#cfd3dc}

.day7 .dot{display:block;width:8px;height:8px;border-radius:50%;margin:4px auto 0;background:var(--line)}.day7 .dot.y{background:var(--ok)}

<header><h1>💪 Tömeg<span>elés</span></h1><button class="iconbtn" id="setBtn" aria-label="Beállítások">⚙️</button></header>

<script>
"use strict";
// ---------- Adatok ----------
const KEY = "tomegeles_v1";
const DAYS = ["Hétfő","Kedd","Szerda","Csütörtök","Péntek","Szombat","Vasárnap"];
const DEFAULT = {
  profile:{name:"Bálint",height:180,age:20,startWeight:72,goalWeight:80,activity:1.6,rate:0.35,kcalAdjust:0,lastAdjust:null,startDate:null},
  split:["Push","Pull","Láb","Push","Pull","Láb","Aktív pihenő"],
  weights:{}, meals:{}, workouts:{}, checks:{}, water:{}, sleep:{}, measures:[], myFoods:[], custom:{}, photos:[], plan:null
};
const TEMPLATES = {
  "Push":[["Fekvenyomás",4,"6–8"],["Ferde kézisúlyzós nyomás",3,"8–10"],["Vállból nyomás",3,"8–10"],["Oldalemelés",3,"12–15"],["Tricepsz letolás kábelen",3,"10–12"],["Fej fölötti tricepsz",2,"12–15"]],
  "Pull":[["Húzódzkodás / lehúzás",4,"6–10"],["Döntött törzsű evezés",3,"8–10"],["Kábeles evezés ülve",3,"10–12"],["Face pull",3,"15–20"],["Bicepsz rúddal",3,"8–12"],["Kalapács bicepsz",2,"10–12"]],
  "Láb":[["Guggolás",4,"5–8"],["Román felhúzás",3,"8–10"],["Lábtoló",3,"10–12"],["Lábhajlítás gépen",3,"10–12"],["Vádliemelés",4,"12–15"],["Plank (mp)",3,"45–60"]],
  "Felsőtest":[["Fekvenyomás",4,"6–8"],["Döntött törzsű evezés",4,"8–10"],["Vállból nyomás",3,"8–10"],["Lehúzás",3,"10–12"],["Bicepsz rúddal",2,"10–12"],["Tricepsz letolás kábelen",2,"10–12"]],
  "Alsótest":[["Guggolás",4,"5–8"],["Román felhúzás",3,"8–10"],["Kitörés",3,"10/láb"],["Lábhajlítás gépen",3,"10–12"],["Vádliemelés",4,"12–15"]],
  "Teljes test":[["Guggolás",3,"6–8"],["Fekvenyomás",3,"6–8"],["Döntött törzsű evezés",3,"8–10"],["Vállból nyomás",2,"8–10"],["Román felhúzás",2,"8–10"]],
  "Aktív pihenő":[],"Pihenő":[]
};
const DAYTYPES = Object.keys(TEMPLATES);
// 100 g-ra (vagy 100 ml-re), + jellemző adag
const FOODS = [
  ["Csirkemell (sült)",165,31,0,3.6,150,"g"],["Rizs (főtt)",130,2.7,28,0.3,250,"g"],["Tészta (főtt)",158,5.8,31,0.9,250,"g"],
  ["Zabpehely",372,13.5,59,7,80,"g"],["Tojás",143,12.6,0.7,9.5,60,"db",1],["Túró (félzsíros)",115,17,3.5,4,250,"g"],
  ["Tej 2,8%",58,3.3,4.7,2.8,300,"ml"],["Görög joghurt",97,9,4,5,150,"g"],["Fehérjepor (adag)",380,75,8,6,30,"g"],
  ["Banán",89,1.1,23,0.3,120,"db",1],["Alma",52,0.3,14,0.2,180,"db",1],["Teljes kiőrlésű kenyér",247,13,41,3.4,80,"g"],
  ["Krumpli (főtt)",87,1.9,20,0.1,300,"g"],["Marhahús (sovány, sült)",217,26,0,12,150,"g"],["Lazac",208,20,0,13,150,"g"],
  ["Tonhal konzerv (lében)",116,26,0,1,120,"g"],["Trappista sajt",340,25,0,27,40,"g"],["Mogyoróvaj",588,25,20,50,30,"g"],
  ["Olívaolaj",884,0,0,100,10,"ml"],["Dió / mandula",620,18,13,55,30,"g"],["Vegyes zöldség",30,2,5,0.3,200,"g"]
];
const FOOD = Object.fromEntries(FOODS.map(f=>[f[0],f]));
// Étrendterv: étkezés-sablonok [név, [[étel, g/ml], ...]]
const MEALS = {
  reggeli:[["Zabkása banánnal",[["Zabpehely",90],["Tej 2,8%",300],["Banán",120],["Mogyoróvaj",20]]],
    ["Tojásos reggeli",[["Tojás",180],["Teljes kiőrlésű kenyér",100],["Trappista sajt",30],["Vegyes zöldség",100]]],
    ["Túrós zabtál",[["Túró (félzsíros)",150],["Zabpehely",70],["Banán",120],["Dió / mandula",15]]]],
  tizorai:[["Joghurt dióval és almával",[["Görög joghurt",200],["Dió / mandula",30],["Alma",180]]],
    ["Tonhalas szendvics",[["Teljes kiőrlésű kenyér",120],["Tonhal konzerv (lében)",80],["Vegyes zöldség",100]]],
    ["Mogyoróvajas kenyér + tej",[["Teljes kiőrlésű kenyér",80],["Mogyoróvaj",25],["Tej 2,8%",300]]]],
  ebed:[["Csirkemell rizzsel",[["Csirkemell (sült)",140],["Rizs (főtt)",350],["Olívaolaj",10],["Vegyes zöldség",200]]],
    ["Marhahús krumplival",[["Marhahús (sovány, sült)",130],["Krumpli (főtt)",450],["Olívaolaj",10],["Vegyes zöldség",200]]],
    ["Lazac rizzsel",[["Lazac",140],["Rizs (főtt)",330],["Vegyes zöldség",200]]],
    ["Csirkés tészta sajttal",[["Csirkemell (sült)",120],["Tészta (főtt)",330],["Trappista sajt",30],["Vegyes zöldség",150]]]],
  uzsonna:[["Banános mogyoróvajas kenyér",[["Teljes kiőrlésű kenyér",80],["Mogyoróvaj",20],["Banán",120]]],
    ["Tömegelő shake",[["Tej 2,8%",400],["Zabpehely",70],["Banán",120],["Mogyoróvaj",25],["Fehérjepor (adag)",20]]],
    ["Joghurt zabbal és almával",[["Görög joghurt",200],["Zabpehely",50],["Alma",180]]]],
  vacsora:[["Tonhalas tészta",[["Tészta (főtt)",320],["Tonhal konzerv (lében)",90],["Olívaolaj",10],["Vegyes zöldség",150]]],
    ["Rántotta kenyérrel",[["Tojás",180],["Teljes kiőrlésű kenyér",120],["Vegyes zöldség",150]]],
    ["Csirke krumplival",[["Csirkemell (sült)",130],["Krumpli (főtt)",400],["Olívaolaj",10],["Vegyes zöldség",150]]],
    ["Marha rizzsel",[["Marhahús (sovány, sült)",120],["Rizs (főtt)",300],["Vegyes zöldség",150]]]],
  esti:[["Túró lefekvés előtt",[["Túró (félzsíros)",200],["Dió / mandula",15]]],["Görög joghurt dióval",[["Görög joghurt",200],["Dió / mandula",20]]]]
};
const SLOTS=[["reggeli","Reggeli","7:00"],["tizorai","Tízórai","10:00"],["ebed","Ebéd","13:00"],["uzsonna","Uzsonna / edzés előtt","16:30"],["vacsora","Vacsora","19:30"],["esti","Esti","22:00"]];
const TIPS = [
  "A reggeli mérés a legpontosabb: ébredés után, WC után, evés előtt. Egy nap nem számít, a heti átlag igen.",
  "Fehérjét oszd el 4–5 étkezésre, étkezésenként kb. 0,4 g/kg (nálad ~30 g). Így jobb az izomépítés.",
  "Ha nehezen eszed meg a kalóriát: igyál belőle. Tej + zab + banán + mogyoróvaj shake könnyen 800+ kcal.",
  "Napi 3–5 g kreatin-monohidrát a legjobban kutatott étrend-kiegészítő erőre és izomtömegre. Mindegy, mikor veszed be.",
  "Progresszív túlterhelés: ha minden szettben eléred a tartomány tetejét, legközelebb emelj 2,5 kg-ot.",
  "Az alvás az anabolikus fegyvered. 7–9 óra alatt lassabb a regeneráció, és nő az étvágyzavar.",
  "Izomcsoportonként heti 10–20 munkaszett a jó tartomány. A mennyiség fontosabb, mint a gyakorlat neve.",
  "A szettek többségét 1–3 ismétléssel a bukás előtt fejezd be. A teljes bukás minden szettben feleslegesen fáraszt.",
  "Edzés előtt 1–3 órával egyél szénhidrátot és fehérjét (pl. rizs + csirke vagy zab + joghurt).",
  "Ha minden nap edzel, legyen legalább egy könnyebb nap séta és nyújtás formájában. Az izom pihenés közben nő.",
  "Ne hajszold a mérleget: havi 0,7–1,5 kg gyarapodás kezdőként jó tempó. A gyorsabb nagy része zsír.",
  "Mérd a kart, a mellkast és a derekat havonta kétszer. Ha a derék sokkal gyorsabban nő, mint a kar, lassíts.",
  "Bemelegítés: 5 perc könnyű kardió, majd az első gyakorlatból 2–3 könnyű, egyre nehezebb szett.",
  "A víz is számít: kb. 35–40 ml/testsúlykg, edzésnapon plusz fél–egy liter.",
  "Lefekvés előtt túró vagy görög joghurt: lassan felszívódó fehérje éjszakára.",
  "Technika előbb, súly utána. A rossz formájú ismétlés a sérülés felé visz, nem a tömeg felé.",
  "Fotózz havonta, ugyanabban a fényben és pózban. A tükör becsap, a fotók nem.",
  "Zöldség és gyümölcs tömegelésnél is kell: rost, vitamin, jobb emésztés. Napi 3–5 adag.",
  "Ha 2 hétig nem nő a súly, emeld a napi kalóriát 150–200 kcal-val. Az app ezt figyeli neked.",
  "A rövid pihenő nem jobb: alapgyakorlatoknál 2–3 perc, izoláló gyakorlatoknál 1–2 perc.",
  "Az alkohol rontja az alvást és a fehérjeszintézist. Ha iszol, edzésnapon kerüld.",
  "Írd fel a súlyokat. Amit mérsz, az fejlődik: a napló mutatja meg, hol akadtál el.",
  "A kardió nem tiltott tömegelésnél: heti 2–3 × 20–30 perc könnyű kardió jót tesz a szívnek és az étvágynak.",
  "Ha fáj az ízület (nem az izom), cserélj gyakorlatot. Mindig van alternatíva."
];

let S = load();
function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)); if(d) return merge(structuredClone(DEFAULT),d);}catch(e){} const d=structuredClone(DEFAULT); d.profile.startDate=today(); return d; }
function merge(a,b){ for(const k in b){ if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k])) a[k]=merge(a[k],b[k]); else a[k]=b[k]; } return a; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ toast("Nem sikerült menteni"); } }

// ---------- Segédek ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function iso(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function today(){ return iso(new Date()); }
function addDays(s,n){ const d=new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return iso(d); }
function dow(s){ return (new Date(s+"T12:00:00").getDay()+6)%7; }
function fmtDate(s){ const d=new Date(s+"T12:00:00"); return d.toLocaleDateString("hu-HU",{month:"short",day:"numeric"}); }
const r0=x=>Math.round(x), r1=x=>Math.round(x*10)/10;
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2200); }
function num(v){ const n=parseFloat(String(v).replace(",",".")); return isFinite(n)?n:null; }

// ---------- Számítások ----------
function sortedWeights(){ return Object.entries(S.weights).sort((a,b)=>a[0]<b[0]?-1:1); }
function currentWeight(){ const w=sortedWeights(); return w.length? w[w.length-1][1] : S.profile.startWeight; }
function avgWeight(endDate,days=7){ const v=[]; for(let i=0;i<days;i++){ const x=S.weights[addDays(endDate,-i)]; if(x) v.push(x);} return v.length>=3? v.reduce((a,b)=>a+b)/v.length : null; }
function weeklyRate(){ const t=today(); const a=avgWeight(t), b=avgWeight(addDays(t,-7)); if(a&&b) return a-b; // kg/hét
  const w=sortedWeights(); if(w.length>=4){ const [d0,w0]=w[0],[d1,w1]=w[w.length-1]; const days=(new Date(d1)-new Date(d0))/864e5; if(days>=6) return (w1-w0)/days*7; } return null; }
function targets(){
  const p=S.profile, w=avgWeight(today())||currentWeight();
  const bmr=10*w+6.25*p.height-5*p.age+5;
  const tdee=bmr*p.activity;
  const surplus=(p.rate/100)*w*7700/7;
  const kcal=Math.round((tdee+surplus+p.kcalAdjust)/10)*10;
  const prot=Math.round(w*2.0), fat=Math.round(w*1.0);
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  return {kcal,prot,fat,carb,tdee:r0(tdee),surplus:r0(surplus),water:Math.round(w*0.04*10)/10,targetRate:Math.round(p.rate/100*w*100)/100};
}
function dayTotals(d){ const m=S.meals[d]||[]; return m.reduce((a,x)=>({kcal:a.kcal+x.kcal,p:a.p+x.p,c:a.c+x.c,f:a.f+x.f}),{kcal:0,p:0,c:0,f:0}); }
function dayType(d){ return S.custom[d] || S.split[dow(d)]; }
function exHistory(name,before){ const ds=Object.keys(S.workouts).filter(d=>d<before).sort().reverse();
  for(const d of ds){ const e=(S.workouts[d]||[]).find(x=>x.name===name&&x.sets.some(s=>s.done)); if(e) return {date:d,sets:e.sets.filter(s=>s.done)}; } return null; }
const e1rm=(w,r)=>w*(1+r/30);
function bestE1rm(name,before){ let b=0; for(const d in S.workouts){ if(before&&d>=before) continue; for(const e of S.workouts[d]) if(e.name===name) for(const s of e.sets) if(s.done&&s.w&&s.r) b=Math.max(b,e1rm(s.w,s.r)); } return b; }
function adaptive(){
  const rate=weeklyRate(), t=targets(), p=S.profile;
  const w=sortedWeights(); if(w.length<6||rate===null) return null;
  const first=w[0][0]; if((new Date(today())-new Date(first))/864e5<13) return null;
  if(p.lastAdjust && (new Date(today())-new Date(p.lastAdjust))/864e5<10) return null;
  if(rate < t.targetRate*0.5) return {delta:+150,msg:`Az elmúlt héten ${rate>=0?"+":""}${r1(rate)} kg/hét volt a tempó, a cél ~+${t.targetRate} kg/hét. Javaslat: +150 kcal/nap.`};
  if(rate > t.targetRate*1.7) return {delta:-150,msg:`Túl gyors a gyarapodás (+${r1(rate)} kg/hét, cél ~+${t.targetRate}). Ennek egy része zsír. Javaslat: −150 kcal/nap.`};
  return null;
}
function streak(){ let n=0,d=today(); if(!(S.workouts[d]||[]).some(e=>e.sets.some(s=>s.done))&&!(S.meals[d]||[]).length) d=addDays(d,-1);
  while(((S.meals[d]||[]).length||(S.workouts[d]||[]).some(e=>e.sets.some(s=>s.done))||S.weights[d])){ n++; d=addDays(d,-1);} return n; }

// ---------- Étrendterv ----------
function weekStart(d){ return addDays(d,-dow(d)); }
function rng(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function newPlan(seed){
  const week=weekStart(today()), R=rng(hash(week)+(seed||0));
  const off=Object.fromEntries(SLOTS.map(([k])=>[k,Math.floor(R()*MEALS[k].length)]));
  S.plan={week,seed:seed||0,picks:[...Array(7)].map((_,d)=>Object.fromEntries(SLOTS.map(([k])=>[k,(off[k]+d)%MEALS[k].length])))};
  save();
}
function getPlan(){ if(!S.plan||S.plan.week!==weekStart(today())) newPlan(0); return S.plan; }
function nutr(items){ return items.reduce((a,[n,g])=>{ const f=FOOD[n]; if(!f) return a; const k=g/100; return {kcal:a.kcal+f[1]*k,p:a.p+f[2]*k,c:a.c+f[3]*k,f:a.f+f[4]*k}; },{kcal:0,p:0,c:0,f:0}); }
function planDay(di){
  const pk=getPlan().picks[di], t=targets();
  const raw=SLOTS.map(([k,l,tm])=>{ const [title,items]=MEALS[k][pk[k]]; return {k,l,tm,title,items}; });
  const base=raw.reduce((a,m)=>a+nutr(m.items).kcal,0);
  const fct=Math.min(1.7,Math.max(0.6,t.kcal/base));
  return raw.map(m=>{ const items=m.items.map(([n,g])=>{ const f=FOOD[n]; if(f[7]){ const c=Math.max(1,Math.round(g*fct/f[5])); return [n,c*f[5]]; } const step=n==="Olívaolaj"?5:10; return [n,Math.max(step,Math.round(g*fct/step)*step)]; }); return {...m,items,n:nutr(items)}; });
}
function fmtItem([n,g]){ const f=FOOD[n]; if(f[7]) return `${Math.round(g/f[5])} db ${n.toLowerCase()}`; if(n==="Fehérjepor (adag)") return `${g} g fehérjepor (${r1(g/30)} adag)`; return `${g} ${f[6]} ${n.toLowerCase()}`; }
function planKey(di,k){ return `${getPlan().week}|${di}|${k}`; }
function eatenKeys(d){ return new Set((S.meals[d]||[]).map(m=>m.plan).filter(Boolean)); }
function eatPlanned(di,k){
  const d=addDays(getPlan().week,di); if(d>today()) return toast("Ez a nap még nem jött el");
  const m=planDay(di).find(x=>x.k===k), key=planKey(di,k);
  if(eatenKeys(d).has(key)){ S.meals[d]=S.meals[d].filter(x=>x.plan!==key); save(); render(); return toast("Visszavonva"); }
  const x={name:m.title,kcal:m.n.kcal,p:m.n.p,c:m.n.c,f:m.n.f,plan:key,time:d===today()?new Date().toLocaleTimeString("hu-HU",{hour:"2-digit",minute:"2-digit"}):""};
  (S.meals[d]=S.meals[d]||[]).push(x); save(); render(); toast(`+${r0(x.kcal)} kcal`);
}
function swapMeal(di,k){ const p=getPlan(); p.picks[di][k]=(p.picks[di][k]+1)%MEALS[k].length; save(); render(); }
function shopping(){
  const sum={}; for(let i=0;i<7;i++) for(const m of planDay(i)) for(const [n,g] of m.items) sum[n]=(sum[n]||0)+g;
  // nyers / bolti mennyiség becslés a főtt súlyból
  const RAW={"Rizs (főtt)":["rizs (nyers)",0.37],"Tészta (főtt)":["tészta (nyers)",0.45],"Csirkemell (sült)":["csirkemell (nyers)",1.33],"Marhahús (sovány, sült)":["sovány marhahús (nyers)",1.35],"Krumpli (főtt)":["krumpli",1.05],"Lazac":["lazac (nyers)",1.2]};
  return Object.entries(sum).map(([n,g])=>{ const f=FOOD[n]; let name=n.toLowerCase(), q=g, u=f[6];
    if(RAW[n]){ name=RAW[n][0]; q=g*RAW[n][1]; }
    if(f[7]) return [name,`${Math.round(g/f[5])} db`];
    if(n==="Tojás") return [name,`${Math.round(g/60)} db`];
    if(n==="Tonhal konzerv (lében)") return ["tonhalkonzerv",`${Math.ceil(g/120)} doboz`];
    if(n==="Tej 2,8%") return ["tej",`${r1(q/1000)} l`];
    return [name, q>=1000?`${r1(q/1000)} kg`:`${Math.round(q/10)*10} ${u}`]; }).sort((a,b)=>a[0]<b[0]?-1:1);
}

// ---------- Fotók (IndexedDB) ----------
let dbp; const photoCache={};
function idb(){ return dbp||(dbp=new Promise((res,rej)=>{ const r=indexedDB.open("tomegeles",1); r.onupgradeneeded=()=>r.result.createObjectStore("photos"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); }
async function pTx(mode,fn){ const db=await idb(); return new Promise((res,rej)=>{ const tx=db.transaction("photos",mode), st=tx.objectStore("photos"); const rq=fn(st); tx.oncomplete=()=>res(rq?.result); tx.onerror=()=>rej(tx.error); }); }
const pGet=k=>pTx("readonly",s=>s.get(k)), pPut=(k,v)=>pTx("readwrite",s=>s.put(v,k)), pDel=k=>pTx("readwrite",s=>s.delete(k));
async function fillPhotos(){ for(const img of document.querySelectorAll("img[data-ph]")){ const k=img.dataset.ph; try{ if(!photoCache[k]) photoCache[k]=await pGet(k); if(photoCache[k]) img.src=photoCache[k]; }catch(e){} } }
function compress(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), im=new Image(); im.onload=()=>{ const s=Math.min(1,900/Math.max(im.width,im.height)), c=document.createElement("canvas"); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext("2d").drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",0.8)); }; im.onerror=rej; im.src=u; }); }
function takePhoto(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*";
  inp.onchange=async()=>{ const f=inp.files[0]; if(!f) return; try{ const d=today(), url=await compress(f); await pPut(d,url); photoCache[d]=url; if(!S.photos.includes(d)) S.photos.push(d); S.photos.sort(); save(); navigator.storage?.persist?.(); render(); toast("Fotó elmentve 📸"); }catch(e){ toast("Nem sikerült menteni a fotót"); } };
  inp.click();
}
function viewPhoto(d){
  const earlier=S.photos.filter(x=>x<=addDays(d,-28)).pop()||(S.photos[0]!==d?S.photos[0]:null);
  modal(`<div class="row sp"><h3 style="margin:0">${fmtDate(d)}</h3><button class="x" onclick="closeModal()">✕</button></div>
  <div class="${earlier?"grid2":""}" style="margin-top:10px">${earlier?`<div><img data-ph="${earlier}" class="ph"><div class="sm mut" style="text-align:center">${fmtDate(earlier)}</div></div>`:""}<div><img data-ph="${d}" class="ph"><div class="sm mut" style="text-align:center">${fmtDate(d)}</div></div></div>
  <div class="row" style="margin-top:12px"><button class="btn g" onclick="delPhoto('${d}')">🗑 Fotó törlése</button></div>`);
  fillPhotos();
}
async function delPhoto(d){ if(!confirmInline()) return; await pDel(d); delete photoCache[d]; S.photos=S.photos.filter(x=>x!==d); save(); closeModal(); render(); }

// ---------- Heti összefoglaló ----------
function weekSummary(mon){
  const days=[...Array(7)].map((_,i)=>addDays(mon,i)).filter(x=>x<=today()), t=targets();
  const wAvg=ds=>{ const v=ds.map(x=>S.weights[x]).filter(Boolean); return v.length?v.reduce((a,b)=>a+b)/v.length:null; };
  const wNow=wAvg(days), wPrev=wAvg([...Array(7)].map((_,i)=>addDays(mon,i-7)));
  const tots=days.filter(x=>(S.meals[x]||[]).length).map(dayTotals);
  const avgK=tots.length?tots.reduce((a,x)=>a+x.kcal,0)/tots.length:null, avgP=tots.length?tots.reduce((a,x)=>a+x.p,0)/tots.length:null;
  const hitK=tots.filter(x=>x.kcal>=t.kcal*0.9).length, hitP=tots.filter(x=>x.p>=t.prot*0.9).length;
  const wds=days.filter(x=>(S.workouts[x]||[]).some(e=>e.sets.some(s=>s.done)));
  let sets=0,vol=0; const wb={};
  for(const x of wds) for(const e of S.workouts[x]) for(const s of e.sets) if(s.done){ sets++; vol+=(s.w||0)*(s.r||0); if(s.w&&s.r) wb[e.name]=Math.max(wb[e.name]||0,e1rm(s.w,s.r)); }
  const prs=Object.entries(wb).filter(([n,v])=>{ const b=bestE1rm(n,mon); return b&&v>b+0.01; }).map(([n,v])=>[n,r0(v)]);
  const photos=days.filter(x=>S.photos.includes(x)).length;
  const change=wNow&&wPrev?wNow-wPrev:null, adv=[];
  if(change===null) adv.push(["info","⚖️ Mérj minden reggel. Két teljes hét után itt látod a heti súlyváltozást."]);
  else if(change<t.targetRate*0.5){ if(avgK&&avgK<t.kcal*0.95) adv.push(["warn",`📉 Kevés gyarapodás (${change>=0?"+":""}${r1(change)} kg), és átlagban ${r0(t.kcal-avgK)} kcal-val a cél alatt maradtál. Jövő héten a feladat: minden nap legyen meg a cél. Kövesd az étrendtervet.`]); else adv.push(["warn",`📉 Megvolt a kalória, mégis csak ${change>=0?"+":""}${r1(change)} kg lett. Emeld a napi célt +150 kcal-val (⚙️ → Kalória igazítás).`]); }
  else if(change>t.targetRate*1.7) adv.push(["warn",`📈 Gyors gyarapodás (+${r1(change)} kg). Ennek egy része zsír, vegyél vissza 150 kcal-t.`]);
  else adv.push(["good",`✅ Jó tempó: +${r1(change)} kg a múlt héthez képest (cél ~+${t.targetRate}).`]);
  if(tots.length&&hitP<tots.length*0.7) adv.push(["warn",`🥩 Csak ${hitP} napon volt meg a fehérjecél. Tegyél be egy túrót vagy shake-et minden napra.`]);
  if(tots.length<days.length-1) adv.push(["info",`📝 ${days.length} napból ${tots.length} napon vezetted a kaját. Pontosabb a kép, ha minden nap beírod.`]);
  if(wds.length>=7) adv.push(["warn","😮‍💨 7/7 edzésnap. Ha esnek a súlyok vagy rosszul alszol, jövő héten legyen 1–2 könnyű nap."]);
  else if(wds.length<3&&days.length>=5) adv.push(["warn",`🏋️ Csak ${wds.length} edzés volt. A cél heti 5–6.`]);
  if(prs.length) adv.push(["good",`🏆 ${prs.length} új csúcs: ${prs.map(p=>p[0]).join(", ")}.`]);
  return {days,wNow,change,avgK,avgP,hitK,hitP,fed:tots.length,wds:wds.length,sets,vol,prs,photos,adv,t};
}
function summaryHTML(mon,compact){
  const s=weekSummary(mon), end=addDays(mon,6), live=end>=today();
  const head=`<div class="sm mut">${fmtDate(mon)} – ${fmtDate(end)}${live?" · folyamatban":""}</div>`;
  const stats=`<div class="grid3" style="margin-top:8px">
    <div class="stat"><div class="v ${s.change===null?"":s.change>=0?"ok":"bad"}">${s.change===null?"–":(s.change>=0?"+":"")+r1(s.change)}</div><div class="l">kg a múlt héthez</div></div>
    <div class="stat"><div class="v">${s.avgK?r0(s.avgK):"–"}</div><div class="l">átl. kcal (cél ${s.t.kcal})</div></div>
    <div class="stat"><div class="v">${s.wds}</div><div class="l">edzés · ${s.sets} szett</div></div></div>`;
  if(compact) return head+stats+(s.adv[0]?`<div class="note ${s.adv[0][0]}">${s.adv[0][1]}</div>`:"");
  return head+stats+`<div class="grid3" style="margin-top:8px">
    <div class="stat"><div class="v">${s.avgP?r0(s.avgP):"–"} g</div><div class="l">átl. fehérje</div></div>
    <div class="stat"><div class="v">${s.hitK}/${s.fed}</div><div class="l">nap kalóriacél</div></div>
    <div class="stat"><div class="v">${s.photos}</div><div class="l">fotó</div></div></div>
    ${s.vol?`<div class="sm mut" style="margin-top:8px">Heti megmozgatott tömeg: <b class="acc">${r0(s.vol).toLocaleString("hu-HU")} kg</b>${s.wNow?` · átlagsúly ${r1(s.wNow)} kg`:""}</div>`:""}
    ${s.prs.length?`<div style="margin-top:8px">${s.prs.map(([n,v])=>`<span class="pr">PR</span> ${esc(n)} ~${v} kg`).join("<br>")}</div>`:""}
    ${s.adv.map(a=>`<div class="note ${a[0]}">${a[1]}</div>`).join("")}`;
}

  <div class="card"><div class="row sp"><h2 style="margin:0">Körméretek</h2><button class="btn sm" style="flex:0 0 auto" onclick="addMeasure()">+ Mérés</button></div>
    ${m1?`<div class="list" style="margin-top:6px">${[["kar","Kar (befeszítve)"],["mell","Mellkas"],["derek","Derék (köldöknél)"],["comb","Comb"]].map(([k,l])=>`<div class="it"><span>${l}</span><span><b>${m1[k]??"–"} cm</b> ${m0!==m1&&m0[k]&&m1[k]?`<span class="${m1[k]-m0[k]>=0?"ok":"bad"} sm">(${m1[k]-m0[k]>=0?"+":""}${r1(m1[k]-m0[k])})</span>`:""}</span></div>`).join("")}</div>
    <div class="sm mut">Utolsó: ${fmtDate(m1.date)} · ${ms.length} mérés. Ha a derék sokkal gyorsabban nő, mint a kar, csökkentsd a kalóriát.</div>`:`<div class="mut" style="margin-top:6px">Mérj kéthetente, reggel, ugyanott.</div>`}</div>
  <div class="card"><h2>Mérések</h2><div class="list">${w.slice().reverse().slice(0,30).map(([d,v])=>`<div class="it"><span>${fmtDate(d)}</span><span><b>${v} kg</b> <button class="x" onclick="delW('${d}')">✕</button></span></div>`).join("")||'<div class="mut">Még nincs mérés.</div>'}</div></div>`;
}
function chart(w){
  if(w.length<2) return `<div class="note info" style="margin:10px 0">A grafikonhoz legalább 2 mérés kell.</div>`;
  const W=340,H=170,P=28, pts=w.slice(-60), d0=new Date(pts[0][0]), d1=new Date(pts[pts.length-1][0]); const span=Math.max(1,(d1-d0)/864e5);
  const vals=pts.map(x=>x[1]); let lo=Math.min(...vals,S.profile.startWeight)-0.5, hi=Math.max(...vals)+0.5;
  const X=d=>P+((new Date(d)-d0)/864e5)/span*(W-P-8), Y=v=>H-18-(v-lo)/(hi-lo)*(H-30);
  const avg=pts.map(([d])=>[d,avgWeight(d)]).filter(x=>x[1]);
  const ticks=[lo+0.5,(lo+hi)/2,hi-0.5].map(v=>r1(v));
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin:10px 0">
  ${ticks.map(v=>`<line x1="${P}" x2="${W-8}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2a2f3a"/><text x="0" y="${Y(v)+3}">${v}</text>`).join("")}
  ${pts.map(([d,v])=>`<circle cx="${X(d)}" cy="${Y(v)}" r="2.5" fill="#9097a6" opacity=".6"/>`).join("")}
  ${avg.length>1?`<polyline fill="none" stroke="#ff7a1a" stroke-width="2.5" stroke-linejoin="round" points="${avg.map(([d,v])=>`${X(d)},${Y(v)}`).join(" ")}"/>`:""}
  <text x="${P}" y="${H-3}">${fmtDate(pts[0][0])}</text><text x="${W-8}" y="${H-3}" text-anchor="end">${fmtDate(pts[pts.length-1][0])}</text></svg>
  <div class="sm mut">Pontok: napi mérés · <span class="acc">vonal: 7 napos átlag</span></div>`;
}
function delW(d){ if(!confirmInline()) return; delete S.weights[d]; save(); render(); }
function addMeasure(){
  modal(`<h3 style="margin-top:0">Körméretek (cm)</h3><div class="grid2">${[["kar","Kar"],["mell","Mellkas"],["derek","Derék"],["comb","Comb"]].map(([k,l])=>`<div><label>${l}</label><input id="m_${k}" inputmode="decimal"></div>`).join("")}</div><div class="row" style="margin-top:12px"><button class="btn" id="mOk">Mentés</button><button class="btn g" onclick="closeModal()">Mégse</button></div>`);
  $("#mOk").onclick=()=>{ const o={date:today()}; ["kar","mell","derek","comb"].forEach(k=>o[k]=num($("#m_"+k).value)); S.measures=S.measures.filter(x=>x.date!==o.date); S.measures.push(o); save(); closeModal(); render(); };
}

// ---- Tudás ----
function vTudas(){
  const t=targets(), w=r1(avgWeight(today())||currentWeight());
  $("#app").innerHTML=`
  <div class="card hero"><h2>A te számaid (${w} kg)</h2>
    <div class="grid2"><div class="stat"><div class="v">${t.kcal}</div><div class="l">kcal / nap</div></div><div class="stat"><div class="v">${t.prot} g</div><div class="l">fehérje (2 g/kg)</div></div>
    <div class="stat"><div class="v">${t.carb} g</div><div class="l">szénhidrát</div></div><div class="stat"><div class="v">${t.fat} g</div><div class="l">zsír (1 g/kg)</div></div></div>
    <div class="sm mut" style="margin-top:8px">Fenntartó szint ≈ ${t.tdee} kcal + ${t.surplus} kcal többlet${S.profile.kcalAdjust?` ${S.profile.kcalAdjust>0?"+":""}${S.profile.kcalAdjust} kcal igazítás`:""}. Cél tempó: ~+${t.targetRate} kg/hét. A becslés kiindulópont; 2 hét mérés után az app a valós súlyváltozás alapján igazít.</div></div>
  <details open><summary>🍽️ Mennyit egyél?</summary><p>Tömegelésnél a heti testsúly <b>0,25–0,5%-ával</b> érdemes gyarapodni. Nálad ez heti kb. 0,2–0,35 kg. Kezdőként a felső érték is rendben van, haladóként inkább az alsó.</p><p>A fehérje <b>1,6–2,2 g/testsúlykg</b>, 3–5 étkezésre elosztva. A zsír maradjon legalább 0,5–1 g/kg, a többi szénhidrát legyen, mert az edzéshez az kell.</p></details>
  <details><summary>🏋️ Hogyan eddz?</summary><p>Izomcsoportonként <b>heti 10–20 munkaszett</b>, és minden izmot hetente legalább kétszer eddz. A Push/Pull/Láb ×2 beosztás pontosan ezt adja.</p><p>Az ismétlések 5–30 között mind építenek izmot, ha a szett közel megy a bukáshoz (0–3 ismétlés tartalék). Az alapgyakorlatoknál 5–10 ismétlés és 2–3 perc pihenő a praktikus.</p><p><b>Progresszív túlterhelés:</b> ha minden szettben megvan a tartomány teteje, emelj súlyt. Ha 2–3 hétig nem nő semmi, nézd meg az alvást és a kalóriát.</p></details>
  <details><summary>😴 Pihenés és alvás</summary><p>Az izom nem edzés közben, hanem pihenés közben nő. Napi 7–9 óra alvás kell. A minden napos edzés akkor működik, ha az egyes izmok között van 48 óra, és legalább egy nap könnyű (séta, nyújtás).</p><p>Figyelmeztető jelek: tartósan eső teljesítmény, rossz alvás, ízületi fájdalom, kedvetlenség. Ilyenkor jöhet egy könnyített hét (fele annyi szett).</p></details>
  <details><summary>💊 Étrend-kiegészítők</summary><p><b>Kreatin-monohidrát</b> napi 3–5 g: a legjobban kutatott kiegészítő, növeli az erőt és az izomtömeget. Biztonságos egészséges felnőtteknek. Feltöltés nem kell.</p><p><b>Fehérjepor:</b> nem csoda, csak kényelmes étel. Akkor jó, ha kajából nehéz meglenni a fehérjecélnak.</p><p>A legtöbb más termék (BCAA, „tesztoszteron-booster”, zsírégető) pénzkidobás. Edzés előtti koffein (3–6 mg/kg) segíthet, de ne este.</p></details>
  <details><summary>⚠️ Fontos</summary><p>Az app általános, kutatásokon alapuló irányelveket ad, nem orvosi tanácsot. Ha valami fáj, szédülsz, vagy egészségügyi problémád van, kérdezz orvost vagy képzett edzőt. Ha 18 év alatti vagy, a kalóriát és a kiegészítőket beszéld meg szülővel vagy orvossal.</p></details>
  <div class="card"><h2>Források</h2><div class="sm">
  <p>• Iraki et al. (2019): Táplálkozási ajánlások testépítőknek tömegelési időszakban. <a href="https://doi.org/10.3390/sports7070154" target="_blank" rel="noopener">Sports 7(7):154</a></p>
  <p>• Jäger et al. (2017): ISSN állásfoglalás a fehérjéről és az edzésről. <a href="https://doi.org/10.1186/s12970-017-0177-8" target="_blank" rel="noopener">JISSN 14:20</a></p>
  <p>• Schoenfeld, Ogborn, Krieger (2017): Heti edzésvolumen és izomnövekedés. <a href="https://doi.org/10.1080/02640414.2016.1210197" target="_blank" rel="noopener">J Sports Sci</a></p>
  <p>• Kreider et al. (2017): ISSN állásfoglalás a kreatinról. <a href="https://doi.org/10.1186/s12970-017-0173-z" target="_blank" rel="noopener">JISSN 14:18</a></p></div></div>`;
}

// ---- Beállítások ----
function settings(){
  const p=S.profile;
  modal(`<h3 style="margin-top:0">Beállítások</h3>
  <div class="grid2"><div><label>Név</label><input id="sN" value="${esc(p.name)}"></div><div><label>Életkor</label><input id="sA" inputmode="numeric" value="${p.age}"></div>
  <div><label>Magasság (cm)</label><input id="sH" inputmode="numeric" value="${p.height}"></div><div><label>Kezdő súly (kg)</label><input id="sW" inputmode="decimal" value="${p.startWeight}"></div>
  <div><label>Célsúly (kg)</label><input id="sG" inputmode="decimal" value="${p.goalWeight}"></div><div><label>Kalória igazítás (kcal)</label><input id="sK" inputmode="numeric" value="${p.kcalAdjust}"></div></div>
  <label>Aktivitás</label><select id="sAc">${[[1.5,"Edzés + ülőmunka/iskola"],[1.6,"Napi edzés + átlagos mozgás"],[1.75,"Napi edzés + fizikai munka / sok séta"],[1.9,"Nagyon aktív"]].map(([v,l])=>`<option value="${v}" ${p.activity==v?"selected":""}>${l}</option>`).join("")}</select>
  <label>Gyarapodási tempó</label><select id="sR">${[[0.25,"Lassú, minimális zsír (0,25%/hét)"],[0.35,"Közepes (0,35%/hét)"],[0.5,"Gyors, kezdőknek (0,5%/hét)"]].map(([v,l])=>`<option value="${v}" ${p.rate==v?"selected":""}>${l}</option>`).join("")}</select>
  <div class="row" style="margin-top:14px"><button class="btn" id="sOk">Mentés</button><button class="btn g" onclick="closeModal()">Mégse</button></div>
  <h3>Biztonsági mentés</h3><div class="sm mut">Az adatok csak ezen a telefonon vannak. Néha ments le egy fájlt (a fotókkal együtt), hogy telefoncserénél se vesszen el semmi.</div>
  <div class="row" style="margin-top:8px"><button class="btn g" onclick="exportData()">⬇️ Mentés fájlba</button><label class="btn g" style="text-align:center;margin:0;color:var(--tx);font-size:15px">⬆️ Visszatöltés<input type="file" accept=".json" style="display:none" onchange="importData(this.files[0])"></label></div>`);
  $("#sOk").onclick=()=>{ p.name=$("#sN").value.trim()||"Bálint"; p.age=num($("#sA").value)||p.age; p.height=num($("#sH").value)||p.height; p.startWeight=num($("#sW").value)||p.startWeight; p.goalWeight=num($("#sG").value)||p.goalWeight; p.kcalAdjust=num($("#sK").value)||0; p.activity=num($("#sAc").value); p.rate=num($("#sR").value); save(); closeModal(); render(); toast(`Napi cél: ${targets().kcal} kcal`); };
}
async function exportData(){ const out=structuredClone(S); out.photoData={}; for(const d of S.photos){ try{ out.photoData[d]=await pGet(d); }catch(e){} } const b=new Blob([JSON.stringify(out)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=`tomegeles-mentes-${today()}.json`; a.click(); }
function importData(f){ if(!f) return; const r=new FileReader(); r.onload=async()=>{ try{ const d=JSON.parse(r.result); if(!d.profile) throw 0; const pd=d.photoData||{}; delete d.photoData; for(const k in pd){ if(pd[k]){ await pPut(k,pd[k]); photoCache[k]=pd[k]; } } S=merge(structuredClone(DEFAULT),d); save(); closeModal(); render(); toast("Visszatöltve ✅"); }catch(e){ toast("Hibás fájl"); } }; r.readAsText(f); }
function modal(h){ $("#modal").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${h}</div></div>`; }
function closeModal(){ $("#modal").innerHTML=""; }

// ---- Első indítás ----
function onboarding(){
  modal(`<h3 style="margin-top:0">Szia Bálint! 💪</h3><div class="sm mut">Pár adat, és kiszámolom a napi kalória- és fehérjecélt. Később a ⚙️ alatt módosíthatod.</div>
  <div class="grid2"><div><label>Mostani súly (kg)</label><input id="oW" inputmode="decimal" value="72"></div><div><label>Magasság (cm)</label><input id="oH" inputmode="numeric" placeholder="pl. 180"></div>
  <div><label>Életkor</label><input id="oA" inputmode="numeric" placeholder="pl. 20"></div><div><label>Célsúly (kg)</label><input id="oG" inputmode="decimal" value="80"></div></div>
  <div class="row" style="margin-top:14px"><button class="btn" id="oOk">Kezdjük!</button></div>`);
  $("#oOk").onclick=()=>{ const p=S.profile; p.startWeight=num($("#oW").value)||72; p.height=num($("#oH").value)||180; p.age=num($("#oA").value)||20; p.goalWeight=num($("#oG").value)||80; p.startDate=today(); p.onboarded=true; S.weights[today()]=r1(p.startWeight); save(); closeModal(); render(); toast(`Napi cél: ${targets().kcal} kcal, ${targets().prot} g fehérje`); };
}

document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{ if(b.dataset.v==="edzes") wDate=today(); if(b.dataset.v==="kaja") kDate=today(); go(b.dataset.v); });
$("#setBtn").onclick=settings;
// Ha reggel előjön a háttérből, új nap → frissítse a mai tervet
let lastDay=today(); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&today()!==lastDay){ lastDay=today(); wDate=kDate=today(); render(); } });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
render();
if(!S.profile.onboarded) onboarding();
</script>
</body>
